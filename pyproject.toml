[project]
name = "dataconf"
version = "4.1.0"
description = "Simple dataclasses configuration management for Python with hocon/json/yaml/toml/properties/env-vars/dict support."
readme = "README.md"
license = "MPL-2.0"
requires-python = ">=3.11"
classifiers = [
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
keywords = [
    "configuration",
    "dataclasses",
    "yaml",
    "toml",
    "hocon",
    "json",
    "properties",
    "cli",
    "environment variables",
]
dependencies = [
    "python-dateutil>=3.0.0",
    "pyyaml>=6.0.2",
    "isodate>=0.7.2",
    "pyhocon>=0.3.61",
    "pyparsing>=3.2.3",
    "tomli-w>=1.2.0",
]

[project.urls]
Repository = "https://github.com/zifeo/dataconf"

[project.scripts]
dataconf = "dataconf.cli:run"

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "pre-commit>=4.2.0",
    "commitizen>=4.8.3",
    "pytest-httpserver>=1.1.3",
    "ruff>=0.12.7",
]

[tool.uv]
default-groups = ["dev"]

[tool.hatch.build.targets.wheel]
packages = ["dataconf"]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$major.$minor.$patch$prerelease"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
